# Render blueprint. Create the service from this file with Blueprints > New,
# then set the two secret values (marked sync: false) in the dashboard.
#
# The free plan spins the service down after 15 minutes idle and a cold start
# takes 30-60s, which is longer than Vercel will wait. .github/workflows/
# keep-alive.yml pings /health every 10 minutes to prevent that; see
# docs/deployment.md for why that still fits inside the free instance hours.

services:
  - type: web
    name: jtrax-backend
    runtime: docker
    plan: free
    region: singapore # closest region to Bangkok
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Turso database URL, e.g. libsql://jtrax-<org>.turso.io
      - key: DATABASE_URL
        sync: false
      # Turso auth token from `turso db tokens create jtrax`.
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Origins allowed to call the API directly. The portals proxy through
      # their own /api route server-side, so this is only a safety net.
      - key: ALLOWED_ORIGINS
        sync: false
      # Forgot-password email over SMTP. Without SMTP_HOST and MAIL_FROM the
      # endpoint still answers, but logs the reset link instead of sending it —
      # which is fine locally and wrong here, so set both before announcing the
      # feature. See docs/deployment.md for picking a provider.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Public URL of each frontend. The account's role picks which one the
      # reset link opens; without ADMIN_URL, staff links fall back to APP_URL.
      - key: APP_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      # Encrypts the LINE channel credentials an admin enters in the console.
      # The credentials themselves are never set here — only this key is, and
      # without it the console refuses to store them at all. Generate with
      # `openssl rand -base64 32` and paste it in the dashboard — Render's own
      # generateValue is not guaranteed to be exactly 32 decodable bytes, and a
      # key of the wrong length fails at boot. See docs/line-messaging.md.
      - key: LINE_TOKEN_KEY
        sync: false
